# 1.21.1 NeoForge cell — independent Gradle build (own wrapper / settings.gradle).
# Same shape as mod-071/neoforge-1.21.11, mod-062-welcome-board/neoforge-26.1.2 and
# mod-061-steady-sight/root(1.21.1): the repo root's settings.gradle does not include
# this directory, so the 26.2 cells (common/fabric/neoforge), neoforge-26.1.2 and
# neoforge-1.21.11 are structurally untouched by this cell.

version=0.1.1
group=com.kuronami.oldglassphotograph

# 1.21.x is Java 21 (LOADERS.md; toolchain and the class file version in the
# shipped jar must agree: 21 -> major 65).
java_version=21

minecraft_version=1.21.1
# Upper bound open at the next family's floor (1.21.2 starts the 1.21.x drift that
# ends at 1.21.9's big rename; mod-047 ships [1.21.1,1.22) on the same line).
minecraft_version_range=[1.21.1,1.22)

mod_name=Old Glass Photograph
mod_author=KURONAMI
mod_id=old_glass_photograph
license=All Rights Reserved
credits=
description=19th-century wet plate photography. Coat the glass, sensitize it, shoot before it dries, and develop it in the darkroom. Anything that moves during the exposure vanishes from the plate.

# Latest stable on the 21.1.x line (RESOLUTION #7 confirmed 21.1.248 exists).
neoforge_version=21.1.248
neoforge_loader_version_range=[1,)

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.configuration-cache=false
