plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Jade 連携（soft-dep）。neoforge 側と同じく compileOnly で、実行時はユーザー環境の Jade に委ねる。
    // ue8CO97w = 26.2.11+fabric（統括が Modrinth API で確認した version id）
    compileOnly 'maven.modrinth:nvQzSEkH:ue8CO97w'
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            // 撮影点の中身を log へ出す。-PogpCaptureDebug を付けた時だけ。
            // シェーダー（Iris）を入れた時に旧撮影点が何を持っているかを実機で測るための口。
            if (project.hasProperty('ogpCaptureDebug')) {
                vmArg('-Dogp.captureDebug=true')
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
