# 1.21.11 NeoForge cell — independent Gradle build (own wrapper / settings.gradle).
# Same shape as mod-071/neoforge-26.1.2, mod-062-welcome-board/neoforge-26.1.2 and
# mod-061-steady-sight/ml-1.21.11: the repo root's settings.gradle does not include
# this directory, so the 26.2 cells (common/fabric/neoforge) and neoforge-26.1.2 are
# structurally untouched by this cell.

version=0.1.2
group=com.kuronami.oldglassphotograph

# 1.21.x is Java 21 (LOADERS.md; toolchain and the class file version in the
# shipped jar must agree: 21 -> major 65).
java_version=21

minecraft_version=1.21.11
# Upper bound closed at the next family's floor (26.1), matching mod-061/ml-1.21.11,
# so a NeoForge install cannot satisfy both this jar and a 26.x jar at once.
minecraft_version_range=[1.21.11,26.1)

mod_name=Old Glass Photograph
mod_author=KURONAMI
mod_id=old_glass_photograph
license=All Rights Reserved
credits=
description=19th-century wet plate photography. Coat the glass, sensitize it, shoot before it dries, and develop it in the darkroom. Anything that moves during the exposure vanishes from the plate.

# Same NeoForge line mod-051 / ml-1.21.11 ship on (not a beta build, unlike 26.x).
neoforge_version=21.11.42
neoforge_loader_version_range=[1,)

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.configuration-cache=false
