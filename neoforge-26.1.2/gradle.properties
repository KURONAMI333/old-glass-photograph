# 26.1.2 NeoForge cell — independent Gradle build (own wrapper / settings.gradle).
# Same shape as mod-062-welcome-board/neoforge-26.1.2 and mod-061-steady-sight/ml-26.1.2:
# the repo root's settings.gradle does not include this directory, so the 26.2
# cells (common/fabric/neoforge) are structurally untouched by this cell.

version=0.1.3
group=com.kuronami.oldglassphotograph

# 26.x is Java 25 (toolchain and the class file version in the shipped jar
# must agree: 25 -> major 69).
java_version=25

minecraft_version=26.1.2
# Upper bound closed at the next cell's floor (26.2) so a NeoForge install
# cannot satisfy both this jar and the 26.2 jar at once (mod-061/ml-26.1.2 and
# mod-062/neoforge-26.1.2 precedent).
minecraft_version_range=[26.1.2,26.2)

mod_name=Old Glass Photograph
mod_author=KURONAMI
mod_id=old_glass_photograph
license=All Rights Reserved
credits=
description=19th-century wet plate photography. Coat the glass, sensitize it, shoot before it dries, and develop it in the darkroom. Anything that moves during the exposure vanishes from the plate.

neoforge_version=26.1.2.92
# Closed on the minor, not left open on the patch number (mod-062 precedent).
neoforge_version_range=[26.1.2,26.2)
neoforge_loader_version_range=[1,)

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.configuration-cache=false
