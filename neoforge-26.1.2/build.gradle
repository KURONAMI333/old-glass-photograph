plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = project.version
group = project.group

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    // Jade tooltip（カメラ・暗室台の状態表示）。compileOnly = soft-dep。
    // 本体 jar には同梱されず、Jade 無し環境ではクラスがロードされる経路が無い
    // （26.2 / 1.21.11 / 1.21.1 の各 neoforge セルと同じ構成）。
    // version id aMkOTJX7 = 26.1.10+neoforge。Modrinth API で 26.1.2 対応を確認済み（2026-09-07）。
    compileOnly 'maven.modrinth:nvQzSEkH:aMkOTJX7'
}

processResources {
    var expandProps = [
            'version'                     : version,
            'mod_name'                    : mod_name,
            'mod_author'                  : mod_author,
            'mod_id'                      : mod_id,
            'license'                     : license,
            'description'                 : project.description,
            'credits'                     : credits,
            'minecraft_version_range'     : minecraft_version_range,
            'neoforge_version'            : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
    ]
    filesMatching(['pack.mcmeta', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }

    // LICENSE は repo root にのみ置く。cell は独立 build なので ../ 相対で参照し、
    // inputs.file() で不在時に build を落とす（PORTING_CHECKLIST §13 —
    // from() は黙って no-op するためガードが要る）。
    def licenseFile = file('../LICENSE')
    def licenseRenamed = "LICENSE_${mod_name}"
    inputs.file(licenseFile)
    from(licenseFile) { rename { licenseRenamed } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
