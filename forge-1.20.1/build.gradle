plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = project.version
group = project.group

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${parchment_minecraft_version}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client { workingDirectory project.file('run') }
        server {
            workingDirectory project.file('run')
            args '--nogui'
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Jade tooltip（カメラ・暗室台の状態表示）。compileOnly + fg.deobf = soft-dep
    // （mod-076 tempad と同じ方式。Forge production jar は SRG 名なので fg.deobf で mojmap へ）。
    // 本体 jar には同梱されず、Jade 無し環境ではクラスがロードされる経路が無い。
    compileOnly fg.deobf("maven.modrinth:nvQzSEkH:${jade_version_id}")
}

processResources {
    var expandProps = [
            'version'              : version,
            'mod_name'             : mod_name,
            'mod_author'           : mod_author,
            'mod_id'               : mod_id,
            'license'              : mod_license,
            'description'          : project.description,
            'minecraft_version_range': minecraft_version_range,
            'forge_version_range'  : forge_version_range,
            'loader_version_range' : loader_version_range,
    ]
    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }

    // LICENSE は repo root にのみ置く。cell は独立 build なので ../ 相対で参照し、
    // inputs.file() で不在時に build を落とす（PORTING_CHECKLIST §13）。
    def licenseFile = file('../LICENSE')
    def licenseRenamed = "LICENSE_${mod_name}"
    inputs.file(licenseFile)
    from(licenseFile) { rename { licenseRenamed } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
