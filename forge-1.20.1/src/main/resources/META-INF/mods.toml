modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
displayURL = "https://github.com/KURONAMI333/old-glass-photograph"
iconFile="${mod_id}.png"
authors="${mod_author}"
description='''${description}'''

# Forge 1.20.1 固有の旧構文（LOADERS.md 正本）:
# dependency の required は type="required" ではなく mandatory=true。
# 新形式を書くと InvalidModFileException "Missing required field mandatory" でロード失敗する。

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
