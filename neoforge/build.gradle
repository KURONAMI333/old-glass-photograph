plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

sourceSets {
    // 開発専用の GameTest 足場。jar タスクの入力は main だけなので、この source set は
    // 出荷 jar に入らない（PLAYBOOK_GAMETEST.md Phase 1 / mod-066 mc-26.2 セルと同型）。
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    addModdingDependenciesTo sourceSets.gametest
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        // GameTest を登録するだけの開発専用 mod。gameTestServer の run にしか読み込ませない。
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
            // 既定は「登録済みの mod 全部」。テスト mod が client/server にも載ってしまうので明示する。
            loadedMods = [project.neoForge.mods.getByName(mod_id)]
        }
        client {
            client()
            // spike 用: -PogpConnect=localhost:25565 を付けるとタイトル画面から自動接続する
            if (project.hasProperty('ogpConnect')) {
                systemProperty('ogp.connect', project.property('ogpConnect').toString())
            }
            // ストア用スクショ撮影: -PogpUsername=KURONAMI333 で dev 既定の "Dev" を上書きする
            // （写真の刻印にプレイヤー名が載るので、公開する画では開発環境の名前を出さない）
            if (project.hasProperty('ogpUsername')) {
                programArguments.addAll '--username', project.property('ogpUsername').toString()
            }
            gameDirectory = project.file('run-client')
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
        // Headless behaviour tests: ./gradlew :neoforge:runGameTestServer
        // namespace は上の configureEach で既に mod_id に設定済み。
        gameTestServer {
            type = 'gameTestServer'
            // テスト本体・テスト mod・テスト用 structure はこの source set にしかない。
            sourceSet = sourceSets.gametest
            loadedMods = [
                    project.neoForge.mods.getByName(mod_id),
                    project.neoForge.mods.getByName("${mod_id}_gametest")
            ]
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
